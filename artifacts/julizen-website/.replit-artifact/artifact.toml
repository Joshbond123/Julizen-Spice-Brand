kind = "web"
previewPath = "/"
title = "Julizen Seasoning Brand Website"
version = "1.0.0"
id = "artifacts/julizen-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19933

[services.development]
run = "pnpm --filter @workspace/julizen-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/julizen-website", "run", "build" ]
publicDir = "artifacts/julizen-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19933"
BASE_PATH = "/"
